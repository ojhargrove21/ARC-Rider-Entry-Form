<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5,user-scalable=yes">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
            background: #f9f9f9;
        }

        body {
            padding: 20px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        label, .section_label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[readonly] {
            background-color: #eee;
        }

        .section-divider {
            border-top: 1px solid #ccc;
            margin: 30px 0;
        }

        .dropdown {
            position: relative;
            width: 100%;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fff;
            width: 90%;
            max-width: 520px;
            max-height: 80vh;
            overflow-y: auto;
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-header {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .modal label {
            display: block;
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #ddd;
        }

        .modal button {
            margin-top: 10px;
        }

        #classDropdownContent {
            display: none !important;
        }

        .no-events-wrap {
            min-height: calc(100vh - 40px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .no-events-card {
            width: 100%;
            max-width: 520px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 22px;
            box-sizing: border-box;
            text-align: center;
        }

        .no-events-card h2 {
            margin: 0 0 10px 0;
        }

        .no-events-card p {
            margin: 0 0 14px 0;
            line-height: 1.4;
        }
    </style>

    <title>Entry Form</title>
</head>

<body>
    <h1 role="main">Entry Form</h1>

    <label for="number">Rider Number:</label>
    <input id="number" list="riderNumbers" placeholder="Select or type Rider Number" onchange="loadRider()">
    <datalist id="riderNumbers"></datalist>

    <label for="firstName">First Name:</label>
    <input id="firstName" readonly>

    <label for="lastName">Last Name:</label>
    <input id="lastName" readonly>

    <label for="age">Age:</label>
    <input id="age" type="number">

    <label for="division">Division</label>
    <select id="division" onchange="loadCheckboxes()">
        <option value="">-- Select Division --</option>
    </select>

    <label for="horse">Horse Name:</label>
    <input id="horse" readonly>

    <div class="section-divider"></div>

    <div class="section_label">Select Classes:</div>

    <div class="dropdown" style="background-color:#fff;" id="dropdownContainer">
        <button type="button"
                style="background-color:#fff; text-align:left;"
                id="classDropdownBtn"
                onclick="handleClassButtonClick()">
            -- Select Classes --
        </button>

        <div id="classDropdownContent"></div>
    </div>

    <div class="modal" id="classModal" aria-modal="true" role="dialog" aria-labelledby="classModalTitle">
        <div class="modal-content" id="classModalContent">
            <div class="modal-header" id="classModalTitle">Select Classes</div>
            <div id="modalCheckboxes"></div>
            <button type="button" onclick="closeModal()">Done</button>
        </div>
    </div>

    <button type="button" onclick="submitForm()">Submit</button>

    <script>
        console.log("[INIT] Script loaded.");

        const API_BASE = "https://script.google.com/macros/s/AKfycbxZXWkl_2etdAxfr9iIlDmVGLxsg_UEcnu4rnR26yexZ49I3uDmeFNSc0KzBWbbn4P70A/exec";

        function setLoadingButton(btnEl, isLoading, loadingText = "Loading...", normalText = "-- Select Classes --") {
            console.log("[UI] setLoadingButton called:", { isLoading, loadingText, normalText });

            if (!btnEl) {
                console.warn("[UI] setLoadingButton: button not found.");
                return;
            }

            if (isLoading) {
                btnEl.dataset.normalText = btnEl.textContent || normalText;
                btnEl.textContent = loadingText;
                btnEl.disabled = true;
                btnEl.setAttribute("aria-busy", "true");
            } else {
                btnEl.textContent = btnEl.dataset.normalText || normalText;
                btnEl.disabled = false;
                btnEl.removeAttribute("aria-busy");
            }
        }

        function setLoadingSelect(selectEl, isLoading, loadingText = "Loading...", normalText = "-- Select Division --") {
            console.log("[UI] setLoadingSelect called:", { isLoading, loadingText, normalText });

            if (!selectEl) {
                console.warn("[UI] setLoadingSelect: select not found.");
                return;
            }

            if (!selectEl.options.length) {
                const opt = document.createElement("option");
                opt.value = "";
                opt.textContent = normalText;
                selectEl.appendChild(opt);
            }

            if (isLoading) {
                selectEl.dataset.normalText = selectEl.options[0].textContent || normalText;
                selectEl.options[0].textContent = loadingText;
                selectEl.disabled = true;
                selectEl.setAttribute("aria-busy", "true");
            } else {
                selectEl.options[0].textContent = selectEl.dataset.normalText || normalText;
                selectEl.disabled = false;
                selectEl.removeAttribute("aria-busy");
            }
        }

        function setLoadingInputPlaceholder(inputEl, isLoading, loadingText = "Loading...") {
            console.log("[UI] setLoadingInputPlaceholder called:", { isLoading, loadingText });

            if (!inputEl) {
                console.warn("[UI] setLoadingInputPlaceholder: input not found.");
                return;
            }

            if (isLoading) {
                inputEl.dataset.normalPlaceholder = inputEl.placeholder || "";
                inputEl.placeholder = loadingText;
                inputEl.disabled = true;
                inputEl.setAttribute("aria-busy", "true");
            } else {
                inputEl.placeholder = inputEl.dataset.normalPlaceholder || inputEl.placeholder || "";
                inputEl.disabled = false;
                inputEl.removeAttribute("aria-busy");
            }
        }

        const CACHE_PREFIX = "entryform:";
        const VERSION_STORE_KEY = CACHE_PREFIX + "versions";
        const CACHE_TTL_MS = 6 * 60 * 60 * 1000;

        function groupForAction(action) {
            switch (action) {
                case "getRiderNumberMap":
                case "findRider":
                    return "riders";
                case "getDivisions":
                    return "divisions";
                case "getClasses":
                case "getActiveEvent":
                    return "classes";
                default:
                    return "misc";
            }
        }

        function dependsOnVersions(group) {
            switch (group) {
                case "riders":
                    return ["riders"];
                case "divisions":
                    return ["divisions"];
                case "classes":
                    return ["events", "classes", "altClasses"];
                default:
                    return ["events", "classes", "altClasses", "riders", "divisions", "entries"];
            }
        }

        async function rawApiGet(action, params = {}) {
            console.log("[API GET] Starting:", { action, params });

            const url = new URL(API_BASE);
            url.searchParams.set("action", action);

            Object.entries(params).forEach(([k, v]) => {
                if (v !== undefined && v !== null) {
                    url.searchParams.set(k, v);
                }
            });

            console.log("[API GET] URL:", url.toString());

            const res = await fetch(url.toString(), {
                method: "GET",
                redirect: "follow"
            });

            console.log("[API GET] Response status:", res.status, res.statusText);

            if (!res.ok) {
                throw new Error("GET failed: " + res.status);
            }

            const data = await res.json();
            console.log("[API GET] Data returned:", data);

            return data;
        }

        async function rawApiPost(action, payloadObj) {
            console.log("[API POST] Starting:", { action, payloadObj });

            const body = new URLSearchParams();
            body.set("action", action);
            body.set("payload", JSON.stringify(payloadObj || {}));

            const res = await fetch(API_BASE, {
                method: "POST",
                body,
                redirect: "follow"
            });

            console.log("[API POST] Response status:", res.status, res.statusText);

            const out = await res.json().catch((err) => {
                console.error("[API POST] Failed to parse JSON:", err);
                return {};
            });

            console.log("[API POST] Data returned:", out);

            return { res, out };
        }

        function loadLocalVersions() {
            try {
                const raw = localStorage.getItem(VERSION_STORE_KEY);
                if (!raw) return null;

                const v = JSON.parse(raw);
                if (!v || typeof v !== "object") return null;

                return v;
            } catch (err) {
                console.warn("[CACHE] Failed to load local versions:", err);
                return null;
            }
        }

        function saveLocalVersions(v) {
            try {
                localStorage.setItem(VERSION_STORE_KEY, JSON.stringify(v));
                console.log("[CACHE] Saved local versions:", v);
            } catch (err) {
                console.warn("[CACHE] Failed to save local versions:", err);
            }
        }

        function clearGroupCache(group) {
            console.log("[CACHE] Clearing group cache:", group);

            const prefix = `${CACHE_PREFIX}${group}:`;

            Object.keys(localStorage).forEach(k => {
                if (k.startsWith(prefix)) {
                    localStorage.removeItem(k);
                }
            });
        }

        function cacheKeyFor(group, action, params) {
            return `${CACHE_PREFIX}${group}:${action}:${JSON.stringify(params || {})}`;
        }

        function readCache(key) {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) {
                    console.log("[CACHE] Miss:", key);
                    return null;
                }

                const obj = JSON.parse(raw);
                if (!obj || typeof obj !== "object") return null;
                if (!obj.savedAt) return null;

                if ((Date.now() - obj.savedAt) > CACHE_TTL_MS) {
                    console.log("[CACHE] Expired:", key);
                    return null;
                }

                console.log("[CACHE] Hit:", key);
                return obj.data;
            } catch (err) {
                console.warn("[CACHE] Failed to read cache:", err);
                return null;
            }
        }

        function writeCache(key, data) {
            try {
                localStorage.setItem(key, JSON.stringify({
                    savedAt: Date.now(),
                    data
                }));

                console.log("[CACHE] Wrote:", key);
            } catch (err) {
                console.warn("[CACHE] Failed to write cache:", err);
            }
        }

        let _versionsPromise = null;

        async function ensureVersionsFresh() {
            console.log("[VERSIONS] ensureVersionsFresh called.");

            if (_versionsPromise) {
                console.log("[VERSIONS] Reusing existing version promise.");
                return _versionsPromise;
            }

            _versionsPromise = (async () => {
                const serverV = await rawApiGet("getVersions");

                const normalizedServerV = {
                    riders: String(serverV.riders || "0"),
                    divisions: String(serverV.divisions || "0"),
                    classes: String(serverV.classes || "0"),
                    altClasses: String(serverV.altClasses || "0"),
                    events: String(serverV.events || "0"),
                    entries: String(serverV.entries || "0")
                };

                console.log("[VERSIONS] Server versions:", normalizedServerV);

                const localV = loadLocalVersions();

                if (!localV) {
                    console.log("[VERSIONS] No local versions found. Saving server versions.");
                    saveLocalVersions(normalizedServerV);
                    return normalizedServerV;
                }

                const changed = [];

                Object.keys(normalizedServerV).forEach(k => {
                    if (String(localV[k] || "0") !== String(normalizedServerV[k] || "0")) {
                        changed.push(k);
                    }
                });

                console.log("[VERSIONS] Changed keys:", changed);

                if (changed.length) {
                    const groups = ["riders", "divisions", "classes", "misc"];

                    groups.forEach(g => {
                        const deps = dependsOnVersions(g);
                        const hit = deps.some(dep => changed.includes(dep));

                        if (hit) {
                            clearGroupCache(g);
                        }
                    });

                    saveLocalVersions(normalizedServerV);
                }

                return normalizedServerV;
            })();

            return _versionsPromise;
        }

        async function apiGet(action, params = {}) {
            console.log("[API CACHED GET] Called:", { action, params });

            if (action === "getVersions") {
                return rawApiGet(action, params);
            }

            await ensureVersionsFresh();

            const group = groupForAction(action);
            const key = cacheKeyFor(group, action, params);

            const cached = readCache(key);
            if (cached !== null) {
                console.log("[API CACHED GET] Returning cached data for:", action);
                return cached;
            }

            const data = await rawApiGet(action, params);

            if (data && typeof data === "object" && data.error) {
                console.warn("[API CACHED GET] API returned error:", data);
                return data;
            }

            writeCache(key, data);
            return data;
        }

        setInterval(() => {
            console.log("[VERSIONS] Interval refresh running.");
            _versionsPromise = null;
            ensureVersionsFresh().catch((err) => {
                console.warn("[VERSIONS] Interval refresh failed:", err);
            });
        }, 120000);

        function setFieldState(readOnly) {
            console.log("[UI] setFieldState:", readOnly);

            ["firstName", "lastName", "horse"].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.readOnly = readOnly;
            });
        }

        function updateClassButtonText() {
            const btn = document.getElementById("classDropdownBtn");

            if (!btn) {
                console.warn("[CLASSES] updateClassButtonText: button not found.");
                return;
            }

            if (btn.disabled) {
                console.log("[CLASSES] updateClassButtonText skipped because button disabled.");
                return;
            }

            const selected = [...document.querySelectorAll("#modalCheckboxes input:checked")].length;
            btn.textContent = selected ? `Select Classes (${selected} selected)` : "Select Classes";

            console.log("[CLASSES] Button text updated. Selected count:", selected);
        }

        function showNoEventsPage_() {
            console.log("[EVENTS] Showing no events page.");

            document.body.innerHTML = `
                <main class="no-events-wrap" role="main">
                    <div class="no-events-card">
                        <h2>No events currently open</h2>
                        <p>Entries are not available right now. Please check back later.</p>
                        <p style="font-size: 13px; color: #555;">
                            If you believe this is a mistake, contact the club administrator.
                        </p>
                    </div>
                </main>
            `;
        }

        document.addEventListener("DOMContentLoaded", async () => {
            console.log("[INIT] DOMContentLoaded fired.");

            let DocHtml = document.body.innerHTML;

            console.log("[INIT] Saved original form HTML.");

            document.body.innerHTML = `
                <main class="no-events-wrap" role="main">
                    <div class="no-events-card">
                        <h2>Loading Form</h2>
                        <p>Please wait while loading form</p>
                    </div>
                </main>
            `;

            console.log("[INIT] Temporary loading page shown.");

            try {
                console.log("[EVENTS] Checking active event...");
                const status = await apiGet("getActiveEvent");

                console.log("[EVENTS] Active event status:", status);

                if (!status || status.active !== true) {
                    showNoEventsPage_();
                    return;
                } else {
                    console.log("[EVENTS] Active event found. Restoring form HTML.");
                    document.body.innerHTML = DocHtml;
                }
            } catch (err) {
                console.error("[EVENTS] Active event check failed:", err);
                showNoEventsPage_();
                return;
            }

            const divisionSelect = document.getElementById("division");
            setLoadingSelect(divisionSelect, true, "Loading divisions...", "-- Select Division --");

            try {
                console.log("[DIVISIONS] Populating divisions...");
                await populateDivisions();
                console.log("[DIVISIONS] Divisions populated.");
            } catch (err) {
                console.error("[DIVISIONS] Failed to populate divisions:", err);
            } finally {
                setLoadingSelect(divisionSelect, false, "Loading divisions...", "-- Select Division --");
            }

            const numberInput = document.getElementById("number");
            setLoadingInputPlaceholder(numberInput, true, "Loading rider list...");

            try {
                console.log("[RIDERS] Building rider number list...");
                await buildRiderNumberList();
                console.log("[RIDERS] Rider number list built.");
            } catch (err) {
                console.error("[RIDERS] Failed to build rider number list:", err);
            } finally {
                setLoadingInputPlaceholder(numberInput, false, "Loading rider list...");
            }

            console.log("[INIT] Page initialization complete.");
        });

        async function populateDivisions() {
            const divisions = await apiGet("getDivisions");
            console.log("[DIVISIONS] Data returned:", divisions);

            const select = document.getElementById("division");

            if (!select) {
                console.warn("[DIVISIONS] Division select not found.");
                return;
            }

            divisions.forEach(d => {
                const option = document.createElement("option");
                option.value = d;
                option.textContent = d;
                select.appendChild(option);
            });
        }

        async function buildRiderNumberList() {
            const existingMap = await apiGet("getRiderNumberMap");
            console.log("[RIDERS] Rider number map:", existingMap);

            const datalist = document.getElementById("riderNumbers");

            if (!datalist) {
                console.warn("[RIDERS] Datalist not found.");
                return;
            }

            datalist.innerHTML = "";

            for (let i = 1; i <= 200; i++) {
                const option = document.createElement("option");
                option.value = i;

                if (existingMap[i]) {
                    option.label = existingMap[i];
                }

                datalist.appendChild(option);
            }

            Object.keys(existingMap)
                .map(Number)
                .filter(n => n > 200)
                .sort((a, b) => a - b)
                .forEach(n => {
                    const option = document.createElement("option");
                    option.value = n;
                    option.label = existingMap[n];
                    datalist.appendChild(option);
                });
        }

        async function loadRider() {
            console.log("[RIDER] loadRider called.");

            const numberInput = document.getElementById("number");

            if (!numberInput) {
                console.warn("[RIDER] Number input not found.");
                return;
            }

            const number = numberInput.value;
            console.log("[RIDER] Selected rider number:", number);

            if (!number) return;

            setLoadingInputPlaceholder(numberInput, true, "Loading rider...");

            try {
                const rider = await apiGet("findRider", { number });
                console.log("[RIDER] Rider returned:", rider);

                const firstNameEl = document.getElementById("firstName");
                const lastNameEl = document.getElementById("lastName");
                const ageEl = document.getElementById("age");
                const horseEl = document.getElementById("horse");

                if (rider.exists) {
                    firstNameEl.value = rider.firstName || "";
                    lastNameEl.value = rider.lastName || "";
                    ageEl.value = rider.age || "";
                    horseEl.value = rider.horse || "";
                    setFieldState(true);
                } else {
                    firstNameEl.value = "";
                    lastNameEl.value = "";
                    ageEl.value = "";
                    horseEl.value = "";
                    setFieldState(false);
                }
            } catch (err) {
                console.error("[RIDER] Failed to load rider:", err);
            } finally {
                setLoadingInputPlaceholder(numberInput, false, "Loading rider...");
            }
        }

        async function loadCheckboxes() {
            console.log("[CLASSES] loadCheckboxes called.");

            const divisionEl = document.getElementById("division");

            if (!divisionEl) {
                console.warn("[CLASSES] Division element not found.");
                return;
            }

            const division = divisionEl.value;
            console.log("[CLASSES] Selected division:", division);

            if (!division) {
                console.warn("[CLASSES] No division selected. Skipping class load.");
                return;
            }

            const btn = document.getElementById("classDropdownBtn");
            setLoadingButton(btn, true, "Loading classes...", "Select Classes");

            try {
                const items = await apiGet("getClasses", { division });
                console.log("[CLASSES] Classes returned:", items);

                renderClassesIntoModal(items);
                updateClassButtonText();
            } catch (err) {
                console.error("[CLASSES] Failed to load classes:", err);
            } finally {
                setLoadingButton(btn, false, "Loading classes...", "Select Classes");
                updateClassButtonText();
            }
        }

        function renderClassesIntoModal(items) {
            console.log("[CLASSES] renderClassesIntoModal called with:", items);

            const modalContainer = document.getElementById("modalCheckboxes");

            if (!modalContainer) {
                console.warn("[CLASSES] modalCheckboxes container not found.");
                return;
            }

            modalContainer.innerHTML = "";

            if (!items || !items.length) {
                console.warn("[CLASSES] No classes found for selected division.");
                modalContainer.innerHTML = "<p>No classes found for this division.</p>";
                return;
            }

            items.forEach((item, i) => {
                const label = document.createElement("label");

                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.value = item;
                cb.id = "modal_" + i;

                cb.addEventListener("change", () => {
                    console.log("[CLASSES] Checkbox changed:", {
                        value: cb.value,
                        checked: cb.checked
                    });

                    updateClassButtonText();
                });

                label.appendChild(cb);
                label.appendChild(document.createTextNode(" " + item));
                modalContainer.appendChild(label);
            });

            console.log("[CLASSES] Rendered checkbox count:", items.length);
        }

        async function handleClassButtonClick() {
            console.log("[CLASSES] Select Classes button clicked.");

            const btn = document.getElementById("classDropdownBtn");
            const divisionEl = document.getElementById("division");
            const modalCheckboxes = document.getElementById("modalCheckboxes");

            console.log("[CLASSES] Button exists:", !!btn);
            console.log("[CLASSES] Division element exists:", !!divisionEl);
            console.log("[CLASSES] Modal checkbox container exists:", !!modalCheckboxes);

            if (btn && btn.disabled) {
                console.warn("[CLASSES] Button is disabled. Click ignored.");
                return;
            }

            if (!divisionEl || !divisionEl.value) {
                console.warn("[CLASSES] No division selected.");
                alert("Please select a division first.");
                return;
            }

            console.log("[CLASSES] Division selected:", divisionEl.value);

            if (!modalCheckboxes || modalCheckboxes.children.length === 0) {
                console.log("[CLASSES] No class checkboxes currently loaded. Loading now...");
                await loadCheckboxes();
            } else {
                console.log("[CLASSES] Existing class checkbox count:", modalCheckboxes.children.length);
            }

            openModal();
        }

        function openModal() {
            console.log("[MODAL] openModal called.");

            const modal = document.getElementById("classModal");

            if (!modal) {
                console.error("[MODAL] classModal not found. Cannot open modal.");
                return;
            }

            modal.style.display = "flex";

            console.log("[MODAL] Modal display set to:", modal.style.display);

            setTimeout(() => {
                const first = document.querySelector("#modalCheckboxes input");

                if (first) {
                    console.log("[MODAL] Focusing first checkbox.");
                    first.focus();
                } else {
                    console.log("[MODAL] No checkbox found to focus.");
                }
            }, 0);
        }

        function closeModal() {
            console.log("[MODAL] closeModal called.");

            const modal = document.getElementById("classModal");
            const btn = document.getElementById("classDropdownBtn");

            if (modal) {
                modal.style.display = "none";
                console.log("[MODAL] Modal closed.");
            } else {
                console.warn("[MODAL] classModal not found while closing.");
            }

            updateClassButtonText();

            if (btn) {
                btn.focus();
            }
        }

        async function submitForm() {
            console.log("[SUBMIT] submitForm called.");

            const submitBtn = document.querySelector('button[onclick="submitForm()"]');

            if (submitBtn) {
                submitBtn.dataset.normalText = submitBtn.textContent || "Submit";
                submitBtn.textContent = "Submitting...";
                submitBtn.disabled = true;
                submitBtn.setAttribute("aria-busy", "true");
            }

            try {
                const selected = [...document.querySelectorAll("#modalCheckboxes input:checked")]
                    .map(cb => cb.value);

                const data = {
                    number: document.getElementById("number").value,
                    firstName: document.getElementById("firstName").value,
                    lastName: document.getElementById("lastName").value,
                    age: +document.getElementById("age").value,
                    division: document.getElementById("division").value,
                    horse: document.getElementById("horse").value,
                    classes: selected
                };

                console.log("[SUBMIT] Payload:", data);

                if (!data.number || data.classes.length === 0) {
                    console.warn("[SUBMIT] Missing rider number or selected classes.");
                    alert("Rider Number and at least one class are required.");
                    return;
                }

                const { res, out } = await rawApiPost("submitForm", data);

                if (!res.ok || out.error) {
                    console.error("[SUBMIT] Submit error:", out);
                    alert("Submit failed: " + (out.error || res.statusText));
                    return;
                }

                _versionsPromise = null;
                await ensureVersionsFresh().catch((err) => {
                    console.warn("[SUBMIT] Version refresh after submit failed:", err);
                });

                alert(out.updatedExisting ? "Entry updated!" : "Entry created!");
            } catch (err) {
                console.error("[SUBMIT] Failed:", err);
                alert("Submit failed. Check the console for details.");
            } finally {
                if (submitBtn) {
                    submitBtn.textContent = submitBtn.dataset.normalText || "Submit";
                    submitBtn.disabled = false;
                    submitBtn.removeAttribute("aria-busy");
                }
            }
        }

        document.addEventListener("click", (e) => {
            const classModal = document.getElementById("classModal");
            const classModalContent = document.getElementById("classModalContent");

            if (!classModal || !classModalContent) return;

            if (classModal.style.display === "flex" && e.target === classModal) {
                console.log("[MODAL] Backdrop clicked. Closing modal.");
                closeModal();
            }
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                const classModal = document.getElementById("classModal");

                if (classModal && classModal.style.display === "flex") {
                    console.log("[MODAL] Escape pressed. Closing modal.");
                    closeModal();
                }
            }
        });
    </script>
</body>
</html>
